<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Défenseurs de l'Espace</title>
<style>
  html,body{margin:0;height:100%;background:#05050f;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{width:min(100vw,calc(100vh*4/3));aspect-ratio:4/3;box-shadow:0 0 40px #000;border-radius:6px}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script src="../heroes.js"></script>
<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const W = 800, H = 600;

/* ---------------- Audio ---------------- */
const Snd = (() => {
  let ac = null, master, next = 0, step = 0, muted = false, noiseBuf;
  const BPM = 140, SD = 60 / BPM / 4;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const bars = [
    [[81,4],[76,2],[77,2],[79,4],[76,4]],
    [[77,4],[72,2],[74,2],[77,4],[81,4]],
    [[79,4],[76,2],[79,2],[84,4],[79,4]],
    [[83,4],[79,2],[74,2],[79,8]],
    [[81,2],[84,2],[88,4],[84,2],[81,2],[76,4]],
    [[81,4],[77,2],[72,2],[77,4],[84,4]],
    [[83,4],[79,2],[83,2],[86,4],[83,4]],
    [[80,4],[83,2],[88,2],[83,4],[80,4]],
  ];
  const mel = new Array(128).fill(null);
  bars.forEach((b, i) => { let s = i * 16; b.forEach(([n, l]) => { mel[s] = [n, l]; s += l; }); });
  const roots  = [45,41,48,43,45,41,43,40];
  const chords = [[57,60,64],[53,57,60],[55,60,64],[55,59,62],[57,60,64],[53,57,60],[55,59,62],[56,59,64]];
  const arp = [0,1,2,1];

  function tone(type, f, t, dur, vol, filt) {
    const o = ac.createOscillator(), g = ac.createGain(); let out = g;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    if (filt) { const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = filt; g.connect(lp); out = lp; }
    out.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, vol, hp, type) {
    const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
    s.buffer = noiseBuf; f.type = type || "highpass"; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
  }
  function kick(t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.2);
  }
  function playStep(s, t) {
    const bar = s >> 4, i = s & 15, m = mel[s];
    if (m) tone("square", mtof(m[0]), t, m[1] * SD * 0.9, 0.04, 3500);
    if (i % 2 === 0) tone("sawtooth", mtof(roots[bar] + (i % 4 === 2 ? 12 : 0)), t, SD * 1.8, 0.11, 600);
    tone("triangle", mtof(chords[bar][arp[i & 3]] + 12), t, SD * 0.9, 0.05);
    if (i % 4 === 0) kick(t);
    if (i === 4 || i === 12) noise(t, 0.13, 0.12, 1800);
    noise(t, 0.03, i % 2 ? 0.02 : 0.035, 7000);
  }
  function schedule() { while (next < ac.currentTime + 0.2) { playStep(step, next); next += SD; step = (step + 1) % 128; } }
  return {
    init() {
      if (ac) { if (ac.state === "suspended") ac.resume(); return; }
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      next = ac.currentTime + 0.1; setInterval(schedule, 25);
    },
    toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; },
    get muted() { return muted; },
    sfx(k) {
      if (!ac) return; const t = ac.currentTime;
      if (k === "shoot") { const o = ac.createOscillator(), g = ac.createGain(); o.type = "square";
        o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(250, t + 0.09);
        g.gain.setValueAtTime(0.035, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.12); }
      else if (k === "boom") noise(t, 0.3, 0.25, 700, "lowpass");
      else if (k === "bigboom") { noise(t, 0.9, 0.4, 500, "lowpass"); tone("sawtooth", 70, t, 0.7, 0.2, 400); }
      else if (k === "power") { [76, 83, 88].forEach((n, j) => tone("square", mtof(n), t + j * 0.06, 0.12, 0.06)); }
      else if (k === "hurt") { const o = ac.createOscillator(), g = ac.createGain(); o.type = "sawtooth";
        o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.5);
        g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.55); noise(t, 0.3, 0.2, 600, "lowpass"); }
      else if (k === "wave") { [69, 72, 76, 81].forEach((n, j) => tone("square", mtof(n), t + j * 0.1, 0.2, 0.06)); }
    }
  };
})();

/* ---------------- Vaisseaux ---------------- */
const SHIPS = HEROES.map(h => ({ name: h.name + " — " + h.ship.label, speed: h.ship.speed, cd: h.ship.cd, color: h.ship.color, shape: h.ship.shape }));
const SHAPES = [
  [[0,-20],[7,-4],[24,12],[8,8],[0,14],[-8,8],[-24,12],[-7,-4]],
  [[0,-26],[6,-8],[7,8],[16,18],[5,13],[0,16],[-5,13],[-16,18],[-7,8],[-6,-8]],
  [[0,-22],[15,-2],[9,14],[0,8],[-9,14],[-15,-2]],
  [[0,-24],[5,-6],[20,-8],[9,4],[14,18],[0,10],[-14,18],[-9,4],[-20,-8],[-5,-6]],
  [[0,-18],[10,-10],[22,0],[18,14],[8,10],[0,16],[-8,10],[-18,14],[-22,0],[-10,-10]],
];
function drawShip(idx, x, y, thrust) {
  const c = SHIPS[idx].color;
  ctx.save(); ctx.translate(x, y);
  const fl = 8 + Math.random() * 8 + thrust * 6;               // flamme
  const g = ctx.createLinearGradient(0, 10, 0, 10 + fl);
  g.addColorStop(0, "#fff"); g.addColorStop(.4, "#ffb23a"); g.addColorStop(1, "rgba(255,80,0,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-5, 10); ctx.lineTo(0, 10 + fl); ctx.lineTo(5, 10); ctx.fill();
  ctx.fillStyle = c; ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); SHAPES[SHIPS[idx].shape].forEach(([px, py], k) => k ? ctx.lineTo(px, py) : ctx.moveTo(px, py));
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#cfefff"; ctx.beginPath(); ctx.ellipse(0, -4, 3.5, 7, 0, 0, 7); ctx.fill();
  ctx.restore();
}

/* ---------------- État ---------------- */
const keys = {};
let state = "title", shipIdx = heroIndexFromUrl(), time = 0, shake = 0, paused = false;
let P, bullets = [], ebullets = [], enemies = [], powers = [], parts = [], queue = [], wave = 0, waveT = 0, banner = 0, score = 0, best = 0, overT = 0;
try { best = +localStorage.getItem("espace-best") || 0; } catch (e) {}
const stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: .3 + Math.random() * 1.2 }));
const rand = (a, b) => a + Math.random() * (b - a);

function newGame() {
  P = { x: W / 2, y: H - 70, r: 13, cd: 0, inv: 0, shield: false, weapon: 1, lives: 3, tilt: 0 };
  bullets = []; ebullets = []; enemies = []; powers = []; parts = []; queue = [];
  wave = 0; score = 0; waveT = 0; banner = 0; state = "play"; nextWave();
}
function nextWave() {
  wave++; queue = []; banner = 2.2; Snd.sfx("wave");
  if (wave % 5 === 0) queue.push({ t: 2.2, type: 3 });
  else {
    const n = Math.min(24, 5 + wave * 2);
    for (let i = 0; i < n; i++) {
      let type = 0, r = Math.random();
      if (wave >= 3 && r < .22) type = 2; else if (wave >= 2 && r < .5) type = 1;
      queue.push({ t: 2.2 + i * Math.max(.35, .7 - wave * .03), type });
    }
  }
  waveT = 0;
}
function spawn(type) {
  const e = { type, x: rand(60, W - 60), y: -30, t: 0, flash: 0, cd: rand(.5, 1.5), vx: Math.random() < .5 ? -80 : 80 };
  e.baseX = e.x;
  if (type === 0) { e.hp = 1; e.r = 16; }
  if (type === 1) { e.hp = 1; e.r = 14; }
  if (type === 2) { e.hp = 3; e.r = 18; e.stopY = rand(70, 190); }
  if (type === 3) { e.hp = e.maxhp = 50 + wave * 8; e.r = 52; e.x = W / 2; e.y = -80; e.cd = 1.5; e.cd2 = 3; e.ang = 0; }
  enemies.push(e);
}
function boom(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.3, s = Math.random() * (speed || 220);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .4 + Math.random() * .5, c: color, s: 2 + Math.random() * 3 }); }
}
function shoot() {
  Snd.sfx("shoot");
  const add = (dx, ang) => bullets.push({ x: P.x + dx, y: P.y - 18, vx: Math.sin(ang) * 640, vy: -Math.cos(ang) * 640 });
  if (P.weapon === 1) add(0, 0);
  else if (P.weapon === 2) { add(-9, 0); add(9, 0); }
  else { add(0, 0); add(-10, -.16); add(10, .16); }
}
function ebullet(x, y, ang, sp) { ebullets.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp }); }
function hitPlayer() {
  if (P.inv > 0) return;
  if (P.shield) { P.shield = false; P.inv = 1; Snd.sfx("hurt"); boom(P.x, P.y, "#4af0ff", 20); return; }
  P.lives--; P.weapon = Math.max(1, P.weapon - 1); P.inv = 2.2; shake = .4; Snd.sfx("hurt"); boom(P.x, P.y, "#ffb23a", 30, 300);
  if (P.lives <= 0) {
    state = "over"; overT = .8; boom(P.x, P.y, "#fff", 60, 400); Snd.sfx("bigboom");
    if (score > best) { best = score; try { localStorage.setItem("espace-best", best); } catch (e) {} }
  }
}
function kill(e) {
  const pts = [10, 20, 50, 1000][e.type];
  score += pts; shake = Math.max(shake, e.type === 3 ? .8 : .12);
  boom(e.x, e.y, e.type === 3 ? "#ff7a3a" : "#ffd23f", e.type === 3 ? 120 : 16, e.type === 3 ? 450 : 220);
  Snd.sfx(e.type === 3 ? "bigboom" : "boom");
  if (e.type === 3) { for (let i = 0; i < 3; i++) powers.push({ x: e.x + (i - 1) * 40, y: e.y, k: ["W", "S", "H"][i] }); }
  else if (Math.random() < .13) powers.push({ x: e.x, y: e.y, k: ["W", "W", "S", "H"][Math.floor(Math.random() * 4)] });
}

/* ---------------- Mise à jour ---------------- */
function update(dt) {
  time += dt;
  for (const s of stars) { s.y += s.z * 60 * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.life <= 0) parts.splice(i, 1); }
  shake = Math.max(0, shake - dt);
  if (state === "title" || paused) return;
  if (state === "over" || state === "win") { overT -= dt; }

  if (state === "play") {
    const dx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0), dy = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
    const sp = SHIPS[shipIdx].speed;
    P.x = Math.max(24, Math.min(W - 24, P.x + dx * sp * dt)); P.y = Math.max(60, Math.min(H - 30, P.y + dy * sp * dt));
    P.tilt = dy;
    P.cd -= dt; if (P.inv > 0) P.inv -= dt;
    if (keys.Space && P.cd <= 0) { shoot(); P.cd = SHIPS[shipIdx].cd; }

    waveT += dt;
    while (queue.length && queue[0].t <= waveT) spawn(queue.shift().type);
    if (!queue.length && !enemies.length) { score += wave * 50; if (wave >= 10) { state = "win"; overT = .8; Snd.sfx("wave"); if (score > best) { best = score; try { localStorage.setItem("espace-best", best); } catch (e) {} } } else nextWave(); }
    if (banner > 0) banner -= dt;
  }

  for (let i = bullets.length - 1; i >= 0; i--) { const b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1); }
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 20 || b.y < -40 || b.x < -20 || b.x > W + 20) { ebullets.splice(i, 1); continue; }
    if (state === "play" && Math.hypot(b.x - P.x, b.y - P.y) < P.r - 2 + 4) { ebullets.splice(i, 1); hitPlayer(); }
  }
  for (let i = powers.length - 1; i >= 0; i--) {
    const p = powers[i]; p.y += 90 * dt;
    if (p.y > H + 20) { powers.splice(i, 1); continue; }
    if (state === "play" && Math.hypot(p.x - P.x, p.y - P.y) < 26) {
      if (p.k === "W") P.weapon = Math.min(3, P.weapon + 1); else if (p.k === "S") P.shield = true; else P.lives = Math.min(5, P.lives + 1);
      score += 25; Snd.sfx("power"); powers.splice(i, 1);
    }
  }
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i]; e.t += dt; e.cd -= dt; if (e.flash > 0) e.flash -= dt;
    if (e.type === 0) { e.y += (90 + wave * 6) * dt; e.x = e.baseX + Math.sin(e.t * 2.2) * 60; }
    else if (e.type === 1) { e.y += (150 + wave * 6) * dt; e.x += (P.x - e.x) * .7 * dt; }
    else if (e.type === 2) {
      if (e.y < e.stopY) e.y += 100 * dt;
      e.x += e.vx * dt; if (e.x < 40 || e.x > W - 40) e.vx = -e.vx;
      if (e.cd <= 0 && state === "play") { e.cd = Math.max(.9, 1.8 - wave * .05); ebullet(e.x, e.y + 14, Math.atan2(P.y - e.y, P.x - e.x), 210 + wave * 6); }
    } else {
      if (e.y < 110) e.y += 60 * dt;
      e.x = W / 2 + Math.sin(e.t * .7) * (W / 2 - 110);
      e.cd -= 0; e.cd2 -= dt;
      if (e.cd <= 0) { e.cd = .9; e.ang += .35; const n = 10; for (let k = 0; k < n; k++) ebullet(e.x, e.y + 30, e.ang + k * 6.283 / n, 150 + wave * 3); }
      if (e.cd2 <= 0 && state === "play") { e.cd2 = 2.6; const a = Math.atan2(P.y - e.y, P.x - e.x); for (let k = -1; k <= 1; k++) ebullet(e.x, e.y + 30, a + k * .18, 280); }
    }
    if (e.type !== 3 && e.y > H + 40) { enemies.splice(i, 1); continue; }
    let dead = false;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
        bullets.splice(j, 1); e.hp--; e.flash = .08; boom(b.x, b.y, "#fff", 2, 120);
        if (e.hp <= 0) { dead = true; break; }
      }
    }
    if (dead) { kill(e); enemies.splice(i, 1); continue; }
    if (state === "play" && P.inv <= 0 && Math.hypot(P.x - e.x, P.y - e.y) < e.r + P.r - 4) {
      hitPlayer(); if (e.type !== 3) { kill(e); enemies.splice(i, 1); }
    }
  }
}

/* ---------------- Rendu ---------------- */
function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const f = e.flash > 0;
  if (e.type === 0) {
    ctx.fillStyle = f ? "#fff" : "#9a5cff"; ctx.beginPath(); ctx.ellipse(0, 2, 18, 9, 0, 0, 7); ctx.fill();
    ctx.fillStyle = f ? "#fff" : "#c9a8ff"; ctx.beginPath(); ctx.ellipse(0, -3, 9, 8, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#ffe24a"; for (let k = -1; k <= 1; k++) ctx.fillRect(k * 9 - 2, 3, 4, 3);
  } else if (e.type === 1) {
    ctx.fillStyle = f ? "#fff" : "#ff8a2a"; ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(14, -12); ctx.lineTo(0, -5); ctx.lineTo(-14, -12); ctx.fill();
    ctx.fillStyle = "#fff3"; ctx.fillRect(-2, -4, 4, 10);
  } else if (e.type === 2) {
    ctx.fillStyle = f ? "#fff" : "#3fbf6a"; ctx.beginPath(); ctx.arc(0, 0, 18, 0, 7); ctx.fill();
    ctx.fillStyle = "#1b6b3a"; ctx.fillRect(-22, -3, 8, 6); ctx.fillRect(14, -3, 8, 6);
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();
    ctx.fillStyle = "#e11"; ctx.beginPath(); ctx.arc(Math.sin(e.t * 3) * 2, 2, 4, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = f ? "#fff" : "#c8283e"; ctx.beginPath(); ctx.moveTo(-70, -10); ctx.lineTo(-40, -35); ctx.lineTo(40, -35); ctx.lineTo(70, -10); ctx.lineTo(45, 30); ctx.lineTo(-45, 30); ctx.fill();
    ctx.fillStyle = "#6e1424"; ctx.fillRect(-60, -6, 120, 8);
    ctx.fillStyle = f ? "#fff" : "#ffd23f"; for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.arc(k * 22, 12, 7, 0, 7); ctx.fill(); }
    ctx.fillStyle = "#1a1a2e"; ctx.beginPath(); ctx.arc(0, -16, 15, 0, 7); ctx.fill();
    ctx.fillStyle = "#ff3d3d"; ctx.beginPath(); ctx.arc(0, -16, 7 + Math.sin(time * 6) * 2, 0, 7); ctx.fill();
  }
  ctx.restore();
  if (e.type === 3) {
    ctx.fillStyle = "#0008"; ctx.fillRect(W / 2 - 150, 50, 300, 10);
    ctx.fillStyle = "#ff4d5e"; ctx.fillRect(W / 2 - 150, 50, 300 * Math.max(0, e.hp / e.maxhp), 10);
  }
}
function text(t, x, y, size, color, align) {
  ctx.font = `bold ${size}px "Trebuchet MS",Verdana,sans-serif`; ctx.textAlign = align || "center";
  ctx.lineWidth = 5; ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.lineJoin = "round"; ctx.strokeText(t, x, y); ctx.fillStyle = color || "#fff"; ctx.fillText(t, x, y);
}
function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#04041a"); bg.addColorStop(1, "#16093a");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * shake * 14, rand(-1, 1) * shake * 14);
  for (const s of stars) { ctx.globalAlpha = .35 + s.z * .4; ctx.fillStyle = "#fff"; ctx.fillRect(s.x, s.y, s.z * 1.8, s.z * 1.8 + s.z * 3); } ctx.globalAlpha = 1;

  if (state !== "title") {
    for (const p of powers) {
      const col = { W: "#ffd23f", S: "#4af0ff", H: "#ff5a7a" }[p.k];
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(p.x, p.y, 13 + Math.sin(time * 8) * 1.5, 0, 7); ctx.fill();
      ctx.fillStyle = "#101020"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "center"; ctx.fillText(p.k === "H" ? "♥" : p.k, p.x, p.y + 5);
    }
    enemies.forEach(drawEnemy);
    ctx.fillStyle = "#7dffb0"; for (const b of bullets) { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vx, -b.vy)); ctx.fillRect(-2, -9, 4, 16); ctx.restore(); }
    for (const b of ebullets) { ctx.fillStyle = "#ff4d6d"; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 7); ctx.fill(); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, 7); ctx.fill(); }
    if (state === "play" && !(P.inv > 0 && Math.floor(time * 14) % 2)) {
      drawShip(shipIdx, P.x, P.y, keys.ArrowUp ? 1 : 0);
      if (P.shield) { ctx.strokeStyle = "rgba(74,240,255," + (.6 + Math.sin(time * 10) * .3) + ")"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(P.x, P.y, 28, 0, 7); ctx.stroke(); }
    }
  }
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s); } ctx.globalAlpha = 1;
  ctx.restore();

  if (state === "title") {
    text("DÉFENSEURS DE L'ESPACE", W / 2, 150, 46, "#ffd23f");
    text("Appuie sur ESPACE pour décoller", W / 2, 215, 24);
    text("← ↑ ↓ → : piloter    •    ESPACE (maintenu) : tirer    •    P : pause    •    M : musique", W / 2, 260, 15, "#bde");
    text("◀  " + SHIPS[shipIdx].name + "  ▶", W / 2, 330, 22, SHIPS[shipIdx].color);
    text("(Tab ou clic gauche/droite pour changer de vaisseau)", W / 2, 358, 14, "#bde");
    drawShip(shipIdx, W / 2, 430, 1);
    if (best) text("Meilleur score : " + best, W / 2, 520, 20, "#fff");
  } else {
    text("Score " + score, 16, 30, 22, "#ffd23f", "left");
    text("Record " + Math.max(best, score), 16, 54, 15, "#bde", "left");
    text("Vague " + wave + "/10", W - 16, 30, 22, "#fff", "right");
    for (let i = 0; i < P.lives; i++) { ctx.save(); ctx.translate(W - 28 - i * 28, 560); ctx.scale(.6, .6); ctx.fillStyle = SHIPS[shipIdx].color; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(18, 14); ctx.lineTo(0, 6); ctx.lineTo(-18, 14); ctx.fill(); ctx.restore(); }
    text("Arme " + "★".repeat(P.weapon) + "☆".repeat(3 - P.weapon) + (P.shield ? "  🛡" : ""), 16, 578, 16, "#ffd23f", "left");
    text(Snd.muted ? "🔇 M" : "🔊 M", W / 2, 590, 13, "#aab");
    if (banner > 0 && state === "play") text(wave % 5 === 0 ? "⚠ BOSS ! ⚠" : "Vague " + wave, W / 2, 260, 52, wave % 5 === 0 ? "#ff5a6e" : "#7dffb0");
    if (paused) text("PAUSE", W / 2, H / 2, 60, "#fff");
    if (state === "win") {
      ctx.fillStyle = "rgba(5,5,20,.6)"; ctx.fillRect(0, 0, W, H);
      text("VICTOIRE !", W / 2, 240, 64, "#ffd23f"); text("Tu as sauvé la galaxie ! Score : " + score, W / 2, 300, 26); text("ESPACE pour rejouer", W / 2, 400, 22, "#bde");
    }
    if (state === "over") {
      ctx.fillStyle = "rgba(5,5,20,.6)"; ctx.fillRect(0, 0, W, H);
      text("GAME OVER", W / 2, 240, 64, "#ff5a6e");
      text("Score : " + score + "   •   Vague " + wave, W / 2, 300, 26);
      if (score >= best && score > 0) text("Nouveau record !", W / 2, 340, 24, "#ffd23f");
      text("ESPACE pour rejouer", W / 2, 400, 22, "#bde");
    }
  }
}

/* ---------------- Entrées & boucle ---------------- */
function cycleShip(fwd) { shipIdx = (shipIdx + (fwd ? 1 : SHIPS.length - 1)) % SHIPS.length; }
addEventListener("keydown", e => {
  if (e.code === "Escape") { location.href = "../index.html?hero=" + shipIdx; return; }
  if (/^(Arrow(Up|Down|Left|Right)|Space|Tab)$/.test(e.code)) e.preventDefault();
  Snd.init();
  if (e.code === "KeyM") { Snd.toggleMute(); return; }
  if (e.code === "KeyP" && state === "play") { paused = !paused; return; }
  if (state === "title") {
    if (/^Arrow(Up|Down|Left|Right)$|^Tab$/.test(e.code)) { cycleShip(e.code === "ArrowDown" || e.code === "ArrowRight" || e.code === "Tab"); return; }
    if (e.code === "Space") { newGame(); return; }
  }
  if ((state === "over" || state === "win") && e.code === "Space" && overT <= 0) { newGame(); return; }
  keys[e.code] = true;
});
addEventListener("keyup", e => { keys[e.code] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; if (state === "play") paused = true; });
cv.addEventListener("click", e => {
  if (state !== "title") return;
  const r = cv.getBoundingClientRect(); cycleShip(e.clientX > r.left + r.width / 2);
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script src="../dock.js"></script>
</body>
