<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archer Magique</title>
<style>
  html,body{margin:0;height:100%;background:#0e2a18;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{width:min(100vw,calc(100vh*4/3));aspect-ratio:4/3;box-shadow:0 0 40px #000;border-radius:6px}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script src="../heroes.js"></script>
<script src="../kit.js"></script>
<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const W = 800, H = 600, GY = 520, AX = 120, AY = 452, TOTAL = 10, ARROWS = 5, G = 520;
let hero = heroIndexFromUrl(), state = "title", time = 0, level = 1, score = 0, lives = 3, best = 0, overT = 0, banner = 0;
let ang = .45, power = 0, charging = false, armed = false, shots = 0, lvScore = 0, arrow = null, stuck = [], wind = 0, tgt = { x: 600, y: 300, r: 50, amp: 0, sp: 1 }, floats = [], wait = 0, phase = "aim", msg = "";
try { best = +localStorage.getItem("archer-best") || 0; } catch (e) {}
const need = () => 18 + level * 8;
const ty = () => tgt.y + Math.sin(time * tgt.sp) * tgt.amp;

function newGame() { level = 1; score = 0; lives = 3; startLevel(); }
function startLevel() {
  shots = 0; lvScore = 0; stuck = []; arrow = null; power = 0; charging = armed = false; phase = "aim"; floats = [];
  tgt = { x: 480 + Math.random() * 270, y: 230 + Math.random() * 180, r: Math.max(26, 58 - level * 3), amp: level >= 4 ? 10 + level * 6 : 0, sp: 1 + level * .15 };
  wind = (Math.random() - .5) * 2 * (6 + level * 8); state = "play"; banner = 1.6;
}
function save() { if (score > best) { best = score; try { localStorage.setItem("archer-best", best); } catch (e) {} } }
function release() {
  if (!charging || state !== "play" || phase !== "aim") { charging = false; return; }
  charging = false; if (power < .08) { power = 0; return; }
  const v = 250 + power * 700; arrow = { x: AX + 20, y: AY, vx: Math.cos(ang) * v, vy: -Math.sin(ang) * v, px: AX + 20, py: AY }; phase = "fly"; shots++; Music.sfx("jump");
}
function endLevel() {
  const ok = lvScore >= need();
  if (ok) { score += 100 * level; msg = "Réussi ! 🎯"; Music.sfx("level"); phase = "done"; wait = 1.6; }
  else { lives--; msg = "Raté… il fallait " + need(); Music.sfx("nope"); phase = "done"; wait = 1.8; }
}
function update(dt) {
  time += dt; overT -= dt; banner -= dt;
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].life -= dt; floats[i].y -= 40 * dt; if (floats[i].life <= 0) floats.splice(i, 1); }
  if (state !== "play" || Kit.paused) return;
  const k = Kit.keys;
  if (phase === "aim") {
    ang = Math.max(.05, Math.min(1.35, ang + ((k.ArrowUp ? 1 : 0) - (k.ArrowDown ? 1 : 0)) * 1.0 * dt));
    if (k.Space && armed) { charging = true; power = Math.min(1, power + dt * .85); } else if (!k.Space && charging) release();
  } else if (phase === "fly" && arrow) {
    arrow.px = arrow.x; arrow.py = arrow.y; arrow.x += arrow.vx * dt; arrow.y += arrow.vy * dt; arrow.vy += G * dt; arrow.vx += wind * dt;
    if (arrow.px < tgt.x && arrow.x >= tgt.x) {
      const f = (tgt.x - arrow.px) / (arrow.x - arrow.px), y = arrow.py + (arrow.y - arrow.py) * f, d = Math.abs(y - ty()), r = tgt.r;
      if (d < r) { const pts = d < r * .2 ? 50 : d < r * .5 ? 20 : 10; lvScore += pts; stuck.push({ dy: y - ty(), a: Math.atan2(arrow.vy, arrow.vx) }); floats.push({ x: tgt.x, y: y - 20, t: pts === 50 ? "+50 ! 🎯" : "+" + pts, life: 1.2 }); Music.sfx(pts === 50 ? "match" : "coin"); arrow = null; }
    }
    if (arrow && (arrow.y > GY || arrow.x > W + 40)) { floats.push({ x: Math.min(arrow.x, W - 40), y: Math.min(arrow.y, GY) - 20, t: "raté", life: 1 }); Music.sfx("bounce"); arrow = null; }
    if (!arrow) { phase = "wait"; wait = .8; }
  } else if (phase === "wait") { wait -= dt; if (wait <= 0) { power = 0; if (shots >= ARROWS) endLevel(); else phase = "aim"; } }
  else if (phase === "done") {
    wait -= dt;
    if (wait <= 0) {
      if (lvScore >= need()) { if (level >= TOTAL) { state = "win"; overT = .8; Music.sfx("win"); save(); } else { level++; startLevel(); } }
      else if (lives <= 0) { state = "over"; overT = .8; Music.sfx("lose"); save(); } else startLevel();
    }
  }
}
function drawArrow(x, y, a, len) { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.strokeStyle = "#8a5a2a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(0, 0); ctx.stroke(); ctx.fillStyle = "#cfd6e4"; ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-2, -4); ctx.lineTo(-2, 4); ctx.fill(); ctx.fillStyle = HEROES[hero].ship.color; ctx.fillRect(-len, -4, 8, 3); ctx.fillRect(-len, 1, 8, 3); ctx.restore(); }
function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#74c8ff"); g.addColorStop(.75, "#d8f0ff"); g.addColorStop(1, "#d8f0ff"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#8fd09a"; ctx.beginPath(); ctx.arc(250, GY + 40, 170, Math.PI, 0); ctx.arc(600, GY + 60, 210, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#5fb04a"; ctx.fillRect(0, GY, W, H - GY); ctx.fillStyle = "#4a9a3a"; ctx.fillRect(0, GY, W, 8);
  if (state === "title") {
    Kit.text(ctx, "ARCHER MAGIQUE", W / 2, 120, 54, "#c8281e");
    Kit.text(ctx, "Vise la cible et tire ta flèche !", W / 2, 170, 22, "#1a3a1a");
    Kit.text(ctx, "↑ ↓ : viser   •   ESPACE (maintenu) : bander l'arc, puis relâche pour tirer", W / 2, 222, 15, "#1a3a1a");
    Kit.text(ctx, "5 flèches par niveau, 10 niveaux. Attention au vent 🌬 et à la cible qui bouge !   P : pause   M : musique", W / 2, 248, 14, "#1a3a1a");
    Kit.text(ctx, "◀  " + HEROES[hero].name + "  ▶   (flèches, Tab ou clic)", W / 2, 330, 22, HEROES[hero].ship.color);
    ctx.save(); ctx.translate(W / 2, 410); ctx.scale(2.2, 2.2); heroSide(ctx, HEROES[hero], 0, true, time); ctx.restore();
    Kit.text(ctx, "Appuie sur ESPACE pour jouer", W / 2, 510, 26, "#fff"); if (best) Kit.text(ctx, "Record : " + best, W / 2, 553, 18, "#fff");
    return;
  }
  const y0 = ty(); ctx.fillStyle = "#8a5a2a"; ctx.fillRect(tgt.x - 4, y0, 8, GY - y0);
  const rings = [["#fff", 1], ["#222", .8], ["#4aa3ff", .6], ["#e8283a", .4], ["#ffd23f", .2]]; rings.forEach(([c, f]) => { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(tgt.x, y0, tgt.r * f * .5, tgt.r * f, 0, 0, 7); ctx.fill(); });
  for (const s of stuck) drawArrow(tgt.x + 3, y0 + s.dy, s.a * .2, 40);
  ctx.save(); ctx.translate(AX, GY - 36 * 1.5 + 6); ctx.scale(1.5, 1.5); heroSide(ctx, HEROES[hero], 0, true, time); ctx.restore();
  ctx.save(); ctx.translate(AX + 16, AY); ctx.rotate(-ang); ctx.strokeStyle = "#8a5a2a"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 38, -1.2, 1.2); ctx.stroke(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; const pull = charging ? power * 24 : 0;
  ctx.beginPath(); ctx.moveTo(38 * Math.cos(-1.2), 38 * Math.sin(-1.2)); ctx.lineTo(-pull, 0); ctx.lineTo(38 * Math.cos(1.2), 38 * Math.sin(1.2)); ctx.stroke(); ctx.restore();
  if (phase === "aim") { if (charging) drawArrow(AX + 16 - Math.cos(ang) * power * 24 + 6, AY + Math.sin(ang) * power * 24, -ang, 44);
    if (level <= 3 && charging) { ctx.fillStyle = "rgba(255,255,255,.7)"; const v = 250 + power * 700; let x = AX + 20, y = AY, vx = Math.cos(ang) * v, vy = -Math.sin(ang) * v; for (let i = 0; i < 16; i++) { for (let s = 0; s < 3; s++) { x += vx * .012; y += vy * .012; vy += G * .012; vx += wind * .012; } ctx.fillRect(x, y, 4, 4); } } }
  if (arrow) drawArrow(arrow.x, arrow.y, Math.atan2(arrow.vy, arrow.vx), 44);
  for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life * 2); Kit.text(ctx, f.t, f.x, f.y, 26, "#fff"); } ctx.globalAlpha = 1;
  Kit.text(ctx, "Score " + score, 14, 34, 24, "#fff", "left"); Kit.text(ctx, "Niveau " + level + "/" + TOTAL, W / 2, 34, 22, "#fff"); Kit.text(ctx, "♥".repeat(Math.max(0, lives)), W - 14, 34, 26, "#ff5a6e", "right");
  Kit.text(ctx, "Points du niveau : " + lvScore + " / " + need(), W / 2, 66, 18, lvScore >= need() ? "#6ee06e" : "#ffd23f");
  Kit.text(ctx, "Flèches : " + "🏹".repeat(Math.max(0, ARROWS - shots)), 14, 66, 16, "#fff", "left");
  Kit.text(ctx, "Vent " + (wind < 0 ? "←" : "→") + " " + Math.abs(Math.round(wind / 4)), W - 14, 66, 18, "#fff", "right");
  ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(40, H - 30, 200, 14); ctx.fillStyle = power > .8 ? "#ff5a6e" : "#6ee06e"; ctx.fillRect(40, H - 30, 200 * power, 14); Kit.text(ctx, "Puissance", 140, H - 36, 12, "#fff");
  Kit.text(ctx, "Angle " + Math.round(ang * 57.3) + "°", 300, H - 18, 14, "#fff");
  if (phase === "done") Kit.text(ctx, msg, W / 2, 300, 40, "#fff");
  if (banner > 0 && phase === "aim") Kit.text(ctx, "Niveau " + level, W / 2, 200, 50, "#fff");
  if (Kit.paused) { ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(0, 0, W, H); Kit.text(ctx, "PAUSE", W / 2, H / 2, 60); }
  if (state === "win") { ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(0, 0, W, H); Kit.text(ctx, "MAÎTRE ARCHER !", W / 2, 240, 58, "#ffd23f"); Kit.text(ctx, "10 niveaux réussis ! Score : " + score, W / 2, 305, 26); Kit.text(ctx, "ESPACE pour rejouer", W / 2, 400, 22, "#bde"); }
  if (state === "over") { ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(0, 0, W, H); Kit.text(ctx, "GAME OVER", W / 2, 240, 64, "#ff5a6e"); Kit.text(ctx, "Score : " + score + "  •  Niveau " + level, W / 2, 305, 26);
    if (score >= best && score > 0) Kit.text(ctx, "Nouveau record !", W / 2, 345, 24, "#ffd23f"); Kit.text(ctx, "ESPACE pour rejouer", W / 2, 405, 22, "#bde"); }
}
Kit.install({
  canvas: cv, song: "calm", getHero: () => hero, setHero: i => { hero = i; }, isTitle: () => state === "title", canPause: () => state === "play",
  keydown(e) {
    if (e.code !== "Space") return;
    if (state === "title" || ((state === "over" || state === "win") && overT <= 0)) newGame();
    else if (state === "play" && phase === "aim" && !Kit.paused && !e.repeat) armed = true;
  },
  keyup(e) { if (e.code === "Space") { if (charging) release(); armed = false; } },
});
Kit.loop(update, draw);
</script>
<script src="../dock.js"></script>
</body>
</html>
