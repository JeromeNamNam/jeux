function wrapText(t, x, y, mw, lh) { const words = t.split(" "); let line = ""; for (const w of words) { if (ctx.measureText(line + w).width > mw) { ctx.fillText(line, x, y); line = w + " "; y += lh; } else line += w + " "; } ctx.fillText(line, x, y); }
function menuRider(y, scale) { ctx.save(); ctx.translate(W / 2, y); ctx.scale(scale, scale); const P = { ...POSES.ride }; drawRig(ctx, P, { wrot: time * 3, barPh: 0, whipPh: 0 }); ctx.restore(); }
function draw() {
  if (state === "title") {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#2a1458"); g.addColorStop(1, "#0f3a5a"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    G("🛴", W / 2, 100, 70, "#fff"); G("TROTT' PARK", W / 2, 175, 54, "#ffd23f"); G("Trottinette freestyle réaliste : un vrai rider, de la vraie physique, toutes les figures !", W / 2, 215, 17);
    G("6 skateparks à choisir  •  séances de 2 minutes ou mode libre  •  3 étoiles par parc", W / 2, 243, 16, "#cfe");
    G("◀  " + HEROES[hero].name + "  ▶   (flèches, Tab ou clic)", W / 2, 320, 22, HEROES[hero].ship.color); menuRider(480, 2.0);
    G("Appuie sur ESPACE pour choisir ton skatepark", W / 2, 520, 24); G("Échap : retour à la salle de jeux  •  M : musique", W / 2, 560, 15, "#bde"); return;
  }
  if (state === "parks") {
    const p = PARKS[pidx], g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, p.sky[0]); g.addColorStop(1, p.sky[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(0, 0, W, H);
    G("CHOISIS TON SKATEPARK", W / 2, 60, 36, "#ffd23f"); G("◀", 60, 300, 60, "#fff"); G("▶", W - 60, 300, 60, "#fff");
    G(p.emoji + "  " + p.name, W / 2, 130, 40, "#fff"); drawParkPreview(ctx, p, 150, 160, 500, 190);
    ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center"; wrapText(p.desc, W / 2, 385, 600, 24);
    const n = starsSaved[p.id] || 0; G("★".repeat(n) + "☆".repeat(3 - n), W / 2, 456, 34, "#ffd23f"); G(best[p.id] ? "Record : " + best[p.id] + " pts" : "Pas encore de record", W / 2, 486, 18, "#fff");
    G("Défi : " + p.goal, W / 2, 514, 16, "#9fe8ff"); PARKS.forEach((q, i) => { ctx.fillStyle = i === pidx ? "#ffd23f" : "rgba(255,255,255,.4)"; ctx.beginPath(); ctx.arc(W / 2 - 75 + i * 30, 542, 7, 0, 7); ctx.fill(); });
    G("← → : choisir  •  ESPACE : séance de 2 min  •  L : mode libre (sans chrono)  •  Retour arrière : changer de héros", W / 2, 580, 13, "#cfe"); return;
  }
  ctx.save(); if (shake > 0) ctx.translate((Math.random() - .5) * shake * 20, (Math.random() - .5) * shake * 20);
  background(ctx); ctx.save(); ctx.scale(Z, Z); terrain(ctx); drawRider(ctx);
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x - cam.x, p.y - cam.y, 4, 4); } ctx.globalAlpha = 1;
  for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life * 2); G(f.t, f.x - cam.x, f.y - cam.y, 20, f.c); } ctx.globalAlpha = 1; ctx.restore(); ctx.restore();
  if (state === "play") hudPlay(ctx);
  if (Kit.paused) { ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, 0, W, H); G("PAUSE", W / 2, H / 2, 60); }
  if (state === "results") {
    ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(0, 0, W, H); G("SÉANCE TERMINÉE !", W / 2, 130, 48, "#ffd23f"); G(pk.name, W / 2, 175, 24); G(results.score + " points", W / 2, 240, 52, "#fff"); if (results.rec) G("Nouveau record !", W / 2, 280, 24, "#6ee06e");
    G(results.stars.map(s => s ? "★" : "☆").join(" "), W / 2, 340, 64, "#ffd23f");
    const lines = [["Score " + pk.s1, results.stars[0]], ["Score " + pk.s2, results.stars[1]], [pk.goal, results.stars[2]]]; lines.forEach(([t, ok], i) => G((ok ? "✔ " : "✘ ") + t, W / 2, 385 + i * 28, 18, ok ? "#6ee06e" : "#ff9a9a"));
    G("Grinds " + st.grinds + "  •  Saltos " + st.flips + "  •  Figures " + st.tricks + "  •  Chutes " + st.bails + "  •  Vitesse max " + Math.round(st.vmax) + " km/h", W / 2, 490, 15, "#cfe");
    G("ESPACE : rejouer ce parc   •   Retour arrière : autre skatepark", W / 2, 540, 18, "#bde");
  }
}

/* ---------------- Clavier ---------------- */
Kit.install({
  canvas: cv, song: "run", getHero: () => hero, setHero: i => { hero = i; }, isTitle: () => state === "title", canPause: () => state === "play",
  keydown(e) {
    const c = e.code;
    if (state === "title") { if (c === "Space") state = "parks"; return; }
    if (state === "parks") { if (c === "ArrowLeft") pidx = (pidx + PARKS.length - 1) % PARKS.length; else if (c === "ArrowRight") pidx = (pidx + 1) % PARKS.length; else if (c === "Space") startRun(false); else if (c === "KeyL") startRun(true); else if (c === "Backspace") state = "title"; if (c === "ArrowLeft" || c === "ArrowRight") Music.sfx("flip"); return; }
    if (state === "results") { if (c === "Space" && overT <= 0) startRun(); else if (c === "Backspace") state = "parks"; return; }
    if (state !== "play" || Kit.paused) return;
    if (c === "KeyR") { startRun(freeMode); return; } if (c === "Backspace") { state = "parks"; return; }
    if (R.mode === "ground" && c === "Space") { const phi = slope(pk, R.x), nx = Math.sin(phi), ny = -Math.cos(phi), J = Kit.keys.ArrowDown ? 560 : 440; takeoff(R.v * Math.cos(phi) + nx * J, R.v * Math.sin(phi) + ny * J, phi); Music.sfx("jump"); burst(R.x, R.y, "#cfd0da", 5); return; }
    if (R.mode === "grind" && c === "Space") { const ang = R.ang; const J = 400, v = R.rv; const r = R.rail; const bank = Math.round(grindAcc); st.score += bank; R.chain++; R.chainT = 4; fl(R.x, R.y - 70, "+" + bank, "#9fe8ff"); takeoff(v * Math.cos(ang) + Math.sin(ang) * J, v * Math.sin(ang) - Math.cos(ang) * J, ang); R.rail = null; Music.sfx("jump"); return; }
    if (R.mode === "air") {
      if (c === "Space" && R.barRevs < 4) { R.barRevs++; R.barT += .34; addTrick(["", "BARSPIN", "DOUBLE BARSPIN", "TRIPLE BARSPIN", "QUADRUPLE BARSPIN"][R.barRevs], 160 + 40 * R.barRevs, "bars"); }
      else if (c === "ArrowUp" && R.whipRevs < 4) { R.whipRevs++; R.whipT += .45; addTrick(["", "TAILWHIP", "DOUBLE TAILWHIP", "TRIPLE TAILWHIP", "QUADRUPLE TAILWHIP"][R.whipRevs], 260 + 60 * R.whipRevs, "whips"); }
    }
  },
});
Kit.loop(update, draw);
