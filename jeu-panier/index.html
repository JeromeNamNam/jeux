<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panier Magique</title>
<style>
  html,body{margin:0;height:100%;background:#102a1a;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{width:min(100vw,calc(100vh*4/3));aspect-ratio:4/3;box-shadow:0 0 40px #000;border-radius:6px}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script src="../heroes.js"></script>
<script src="../kit.js"></script>
<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const W = 800, H = 600, GY = 548, TOTAL = 10;
const FRUITS = ["🍎", "🍌", "🍇", "🍓", "🍉", "🍊", "🍒", "🍍"];
let hero = heroIndexFromUrl(), state = "title", time = 0, level = 1, score = 0, lives = 3, best = 0, overT = 0, banner = 0, caught = 0, spawnT = 0, big = 0, bigCd = 0, combo = 0;
let P = { x: W / 2, dir: 1, run: 0, inv: 0 }, items = [], parts = [], floats = [];
try { best = +localStorage.getItem("panier-best") || 0; } catch (e) {}
const quota = () => 6 + level * 2;

function newGame() { level = 1; score = 0; lives = 3; startLevel(); }
function startLevel() { items = []; parts = []; floats = []; caught = 0; spawnT = .5; big = 0; bigCd = 0; combo = 0; P.inv = 1; state = "play"; banner = 1.6; }
function save() { if (score > best) { best = score; try { localStorage.setItem("panier-best", best); } catch (e) {} } }
function spawn() {
  const r = Math.random(), x = 40 + Math.random() * (W - 80), vy = 150 + level * 22 + Math.random() * 60;
  const kind = r < .15 + level * .012 ? "bomb" : r < .2 + level * .012 ? "star" : "fruit";
  items.push({ x, y: -30, vy, kind, e: kind === "bomb" ? "💣" : kind === "star" ? "⭐" : FRUITS[Math.floor(Math.random() * FRUITS.length)], rot: 0 });
}
function boom(x, y, c, n) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.3, s = 40 + Math.random() * 180; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: .5, c }); } }
function update(dt) {
  time += dt; overT -= dt; banner -= dt;
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; if (p.life <= 0) parts.splice(i, 1); }
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].life -= dt; floats[i].y -= 40 * dt; if (floats[i].life <= 0) floats.splice(i, 1); }
  if (state !== "play" || Kit.paused) return;
  const k = Kit.keys, dx = (k.ArrowRight ? 1 : 0) - (k.ArrowLeft ? 1 : 0); if (dx) { P.dir = dx; P.run += dt * 14; } P.x = Math.max(40, Math.min(W - 40, P.x + dx * 360 * dt));
  if (P.inv > 0) P.inv -= dt; big = Math.max(0, big - dt); bigCd = Math.max(0, bigCd - dt);
  spawnT -= dt; if (spawnT <= 0) { spawn(); spawnT = Math.max(.28, .85 - level * .05) + Math.random() * .25; }
  const rw = big > 0 ? 95 : 50;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i]; it.y += it.vy * dt; it.rot += dt * 3;
    if (it.y > GY - 28 && it.y < GY + 18 && Math.abs(it.x - P.x) < rw) {
      items.splice(i, 1);
      if (it.kind === "bomb") { if (P.inv <= 0) { lives--; P.inv = 2; combo = 0; Music.sfx("hit"); boom(it.x, it.y, "#ff9a3c", 22); floats.push({ x: it.x, y: it.y - 20, t: "💥", life: 1 }); if (lives <= 0) { state = "over"; overT = .8; Music.sfx("lose"); save(); return; } } }
      else { combo++; const pts = (it.kind === "star" ? 50 : 10) + Math.min(20, combo); score += pts * (it.kind === "star" ? 1 : 1); if (it.kind === "fruit") caught++; else caught += 2; Music.sfx(it.kind === "star" ? "match" : "coin"); boom(it.x, it.y, it.kind === "star" ? "#ffd23f" : "#fff", 8); floats.push({ x: it.x, y: it.y - 20, t: "+" + pts, life: .8 }); }
    } else if (it.y > H + 30) { items.splice(i, 1); if (it.kind !== "bomb") combo = 0; }
  }
  if (caught >= quota()) { score += 50 * level; Music.sfx("level"); if (level >= TOTAL) { state = "win"; overT = .8; Music.sfx("win"); save(); } else { level++; startLevel(); } }
}
function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#7fd6ff"); g.addColorStop(.7, "#d8f5c0"); g.addColorStop(1, "#6ec04a"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(160, 90, 54, 18, 0, 0, 7); ctx.ellipse(560, 60, 64, 20, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#4fa83a"; ctx.fillRect(0, GY + 20, W, H);
  if (state === "title") {
    ctx.fillStyle = "rgba(10,40,20,.45)"; ctx.fillRect(0, 0, W, H);
    Kit.text(ctx, "PANIER MAGIQUE", W / 2, 130, 54, "#ffd23f");
    Kit.text(ctx, "Attrape les fruits qui tombent, évite les bombes !", W / 2, 180, 22);
    Kit.text(ctx, "← → : bouger   •   ESPACE : panier géant (8 s d'attente)   •   P : pause   •   M : musique", W / 2, 228, 15, "#fff");
    Kit.text(ctx, "🍎 +10     ⭐ +50     💣 une vie en moins     10 niveaux", W / 2, 256, 17, "#ffd23f");
    Kit.text(ctx, "◀  " + HEROES[hero].name + "  ▶   (flèches, Tab ou clic)", W / 2, 330, 22, "#fff");
    ctx.save(); ctx.translate(W / 2, 395); ctx.scale(2.2, 2.2); heroSide(ctx, HEROES[hero], Math.sin(time * 10) * 5, true, time); ctx.restore();
    Kit.text(ctx, "Appuie sur ESPACE pour jouer", W / 2, 510, 26); if (best) Kit.text(ctx, "Record : " + best, W / 2, 553, 18, "#fff");
    return;
  }
  ctx.font = "34px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const it of items) { ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(Math.sin(it.rot) * .3); ctx.fillText(it.e, 0, 0); ctx.restore(); } ctx.textBaseline = "alphabetic";
  if (!(P.inv > 0 && Math.floor(time * 14) % 2)) {
    ctx.save(); ctx.translate(P.x, GY - 34); ctx.scale(1.3 * P.dir, 1.3); heroSide(ctx, HEROES[hero], Math.sin(P.run) * 5, true, time); ctx.restore();
    const rw = big > 0 ? 95 : 50; ctx.fillStyle = "#a8712f"; ctx.beginPath(); ctx.moveTo(P.x - rw, GY - 26); ctx.lineTo(P.x + rw, GY - 26); ctx.lineTo(P.x + rw * .72, GY + 14); ctx.lineTo(P.x - rw * .72, GY + 14); ctx.fill();
    ctx.fillStyle = "#c98a3a"; for (let k = -rw + 12; k < rw - 6; k += 16) ctx.fillRect(P.x + k, GY - 22, 4, 32); ctx.fillStyle = "#8a5a1a"; ctx.fillRect(P.x - rw, GY - 30, rw * 2, 8);
  }
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 4, 4); } ctx.globalAlpha = 1;
  for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life * 2); Kit.text(ctx, f.t, f.x, f.y, 22, "#ffd23f"); } ctx.globalAlpha = 1;
  Kit.text(ctx, "Score " + score, 14, 32, 24, "#ffd23f", "left"); Kit.text(ctx, "Niveau " + level + "/" + TOTAL, W / 2, 32, 22, "#fff");
  Kit.text(ctx, "♥".repeat(Math.max(0, lives)), W - 14, 32, 26, "#ff5a6e", "right");
  ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(W / 2 - 100, 44, 200, 12); ctx.fillStyle = "#6ee06e"; ctx.fillRect(W / 2 - 100, 44, 200 * Math.min(1, caught / quota()), 12); Kit.text(ctx, caught + "/" + quota() + " fruits", W / 2, 76, 14, "#fff");
  if (combo > 2) Kit.text(ctx, "Série x" + combo, 14, 62, 18, "#6ee06e", "left");
  ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(14, H - 26, 120, 12); ctx.fillStyle = bigCd > 0 ? "#888" : "#ffe98a"; ctx.fillRect(14, H - 26, 120 * (1 - bigCd / 8), 12); Kit.text(ctx, "GÉANT (espace)", 74, H - 32, 11, "#fff");
  if (banner > 0 && state === "play") Kit.text(ctx, "Niveau " + level, W / 2, 300, 54);
  if (Kit.paused) { ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(0, 0, W, H); Kit.text(ctx, "PAUSE", W / 2, H / 2, 60); }
  if (state === "win") { ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(0, 0, W, H); Kit.text(ctx, "BRAVO !", W / 2, 240, 64, "#ffd23f"); Kit.text(ctx, "10 niveaux de fruits ! Score : " + score, W / 2, 305, 26); Kit.text(ctx, "ESPACE pour rejouer", W / 2, 400, 22, "#bde"); }
  if (state === "over") { ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(0, 0, W, H); Kit.text(ctx, "GAME OVER", W / 2, 240, 64, "#ff5a6e"); Kit.text(ctx, "Score : " + score + "  •  Niveau " + level, W / 2, 305, 26);
    if (score >= best && score > 0) Kit.text(ctx, "Nouveau record !", W / 2, 345, 24, "#ffd23f"); Kit.text(ctx, "ESPACE pour rejouer", W / 2, 405, 22, "#bde"); }
}
Kit.install({
  canvas: cv, song: "brick", getHero: () => hero, setHero: i => { hero = i; }, isTitle: () => state === "title", canPause: () => state === "play",
  keydown(e) {
    if (e.code !== "Space") return;
    if (state === "title" || ((state === "over" || state === "win") && overT <= 0)) newGame();
    else if (state === "play" && !Kit.paused && bigCd <= 0) { big = 4; bigCd = 8; Music.sfx("power"); }
  },
});
Kit.loop(update, draw);
</script>
<script src="../dock.js"></script>
</body>
</html>
